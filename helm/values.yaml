# Public host name of the CA, e.g. acme.example.com: the Gateway's hostname, the certificate's name and, unless
# acme.externalUrl is set, the base of every URL the CA hands to clients (https://<host>). Required unless `environment` is
# dev, development or test.
host: ''
# NODE_ENV. Anything other than dev/development/test is a real deployment: the service then refuses to start without an https
# external URL, real challenge-mail addresses, an SMTP relay and a DKIM key, and this chart fails the render for the same
# reasons (see templates/_helpers.tpl, "acme.validate"). Development values put certificates' CRL/OCSP addresses at
# http://localhost - never issue real certificates from such an install.
environment: production
nameOverride: ''
fullnameOverride: ''
logs:
  level: info

# The base URL of every URL the CA hands to clients and writes into certificates (directory, CRL, OCSP, AIA). Empty means
# https://<host>. Must be a bare https origin in a real deployment, and must not change once certificates were issued: their
# CRL/OCSP/issuer addresses are baked in. Set it when TLS ends in front of this chart (a load balancer, another Gateway).
acme:
  externalUrl: ''
  # The terms of service URL in the directory. Empty means <external URL>/terms, which the CA serves itself.
  termsOfServiceUrl: ''
  website: https://rapidmx.io
  # What a domain's CAA `issuemail` property must name for this CA to issue for it (RFC 9495). Empty keeps the service's
  # default, ["rapidmx.io"] - change it to the identity of YOUR operator, or nothing but rapidmx.io-authorised domains work.
  caaIdentities: []
  # "strict": the DKIM d= of a reply must equal the From domain (RFC 8823). "relaxed": a parent domain is enough.
  dkimAlignment: strict

# The challenge e-mail. `from` is the RFC 8823 challenge sender, `replyTo` is where the applicant must send the reply: both
# must be real addresses on the CA's own domain, and `replyTo`'s domain needs an MX record that reaches this CA's inbound
# SMTP (see docs/DEPLOYMENT.md). Empty means acme-challenge@<host> and acme-response@<host>.
mail:
  from: ''
  replyTo: ''
  # The outbound relay the challenge e-mail is sent through. Required in a real deployment.
  smtp:
    host: ''
    port: 587
    # Implicit TLS (SMTPS, usually port 465). Leave false for STARTTLS on 587, which nodemailer negotiates when offered.
    secure: false
    # Never negotiate STARTTLS. Only for a trusted in-cluster relay that does not offer it.
    ignoreTLS: false
    user: ''
    # A Secret holding the relay password under `passwordKey`; required when `user` is set. It reaches the service as an
    # environment variable, and the service's settings parser reads anything that looks like JSON (1.0, true, null) as
    # that value rather than as text: avoid such a password.
    existingSecret: ''
    passwordKey: password
  # The DKIM private key the challenge e-mail is signed with (RFC 8823 requires it). Required in a real deployment.
  dkim:
    # A Secret holding the PEM private key under `key` (kubectl create secret generic acme-dkim
    # --from-file=dkim.key=./mail.private). Mounted read-only at /var/lib/acme/dkim.
    existingSecret: ''
    key: dkim.key
    # Empty means the domain of mail.from; with acme.dkimAlignment "strict" it must equal it.
    domain: ''
    # The DNS label under _domainkey holding the public key: <selector>._domainkey.<domain>.
    selector: ''

# The CA hierarchy. Not generated by the chart on purpose: the private key of a CA is created by you (yarn ca:init, the root
# on an offline machine) and handed over as a Secret. Required in every environment - the service does not start without an
# issuer manifest.
ca:
  # A Secret holding issuers.json and the certificate/key files it names, mounted read-only at /var/lib/acme/ca (the
  # service's acme.ca.manifest default). Create it from a ca:init output directory with scripts/ca-k8s-secret.sh, which also
  # prints the `items` below. NEVER put a root private key in it.
  existingSecret: ''
  # Secret keys cannot contain "/", but issuers.json names files in sub-directories (smime-r1/cert.pem): each item maps a
  # key to the path it is mounted at, relative to /var/lib/acme/ca. Empty mounts every key as a file at the top level, which
  # needs an issuers.json whose paths are flat (e.g. "cert.pem").
  items: []
  # - key: smime-r1--cert.pem
  #   path: smime-r1/cert.pem
  # The passphrase of an encrypted issuer key, as the environment variable ACME_CA_KEY_PASSPHRASE (the name ca:init records
  # in issuers.json as `passphrase_env` with --passphrase-env ACME_CA_KEY_PASSPHRASE). Not needed for an unencrypted key
  # (not recommended) or an OpenBao Transit key.
  passphrase:
    existingSecret: ''
    key: passphrase

# Where applicants' reply e-mails arrive. Two options, which can be combined:
#  1. the CA's built-in SMTP receiver (inboundSmtp): expose it as a separate Service on port 25 and point the MX record of
#     mail.replyTo's domain at it;
#  2. an MTA of your own (Postfix, SES) in front, forwarding to POST /internal/mail/inbound with `inboundHttp.secret`. That
#     route is answered by the pods' Service inside the cluster and is never routed through the Gateway.
inboundSmtp:
  enabled: false
  # The receiver's size limit for one message.
  maxSizeBytes: 1048576
  service:
    # LoadBalancer, NodePort or ClusterIP. Port 25 must be reachable from the internet for MX delivery to work; many clouds
    # block it by default.
    type: LoadBalancer
    port: 25
    # Only for NodePort.
    nodePort: null
    annotations: {}
    loadBalancerIP: ''
    loadBalancerSourceRanges: []
    # "Local" keeps the sender's address (the CA's logs and SPF see it) and skips a hop; it needs a load balancer that
    # health-checks nodes. Use "Cluster" if yours cannot. Ignored for ClusterIP.
    externalTrafficPolicy: Local
  # Offers STARTTLS on the receiver. A Secret of type kubernetes.io/tls (tls.crt, tls.key) for the host name in the MX
  # record, e.g. issued by cert-manager. Read once at start: restart the pods after a renewal. Without it the receiver
  # accepts mail in the clear; most sending MTAs then deliver in the clear (opportunistic TLS).
  tls:
    existingSecret: ''
inboundHttp:
  # Generates the bearer secret of POST /internal/mail/inbound (the route answers 404 without one) - set false when only
  # the built-in receiver is used. Generated once and kept across upgrades. Read it with the command in NOTES.txt.
  enabled: true
  secret: ''
admin:
  # Generates the bearer secret of the operator API (/admin: search and revoke certificates, suspend accounts). It can revoke
  # every certificate this CA issued, so it is never routed through the Gateway: reach it with `kubectl port-forward` or from
  # inside the cluster (docs/DEPLOYMENT.md). The API answers 404 without a secret - set false to switch it off. Generated once
  # and kept across upgrades (at least 32 characters). Read it with the command in NOTES.txt.
  enabled: true
  secret: ''
metrics:
  # Generates the bearer secret of GET /metrics (404 without one), for a scraper inside the cluster. Never routed through
  # the Gateway.
  enabled: true
  secret: ''
# Secrets this chart would generate (metrics, inbound HTTP and admin) come from this Secret instead when it is set. Keys:
# acme__metrics_secret, acme__mail__inbound__http_secret, acme__admin_secret. Use it, or set every secret explicitly, when the chart is rendered
# without cluster access (helm template, GitOps), where generated values could not be kept stable.
secrets:
  existingSecret: ''

# REQUIRED with the Gateway: the addresses (CIDRs) of the reverse proxies whose X-Forwarded-For the per-IP rate limits trust.
# Behind the Gateway every request comes from a proxy pod, so without this every client shares one address - one applicant
# could exhaust the per-IP limits for everybody, and no limit would ever tell clients apart. Set it to the smallest range that
# covers your Gateway (Envoy Gateway or nginx-gateway pods, or the load balancer in front of the cluster) and nothing else: an
# address listed here can claim any client address. Find the pods' addresses with `kubectl get pods -A -o wide | grep -i envoy`;
# the pod CIDR of the nodes that run the Gateway is often the practical choice. The render fails when it is empty and
# gateway.enabled is true (a development environment is exempt).
trustedProxies: []
#  - 10.42.0.0/16

# Public HTTP(S) exposure through the Gateway API (the same approach as the RapidMX server chart). Only the CA's public paths
# are routed: /metrics and /internal/* (mail ingest) are not, and must never be - they are reached through the in-cluster
# Service only, with their bearer secrets.
gateway:
  enabled: true
  # An existing Gateway to attach to, or the one this chart creates (the default name).
  name: '{{ include "rrst.fullname" . }}-gateway'
  namespace: '{{ .Release.Namespace }}'
  className: envoy
  # "true" leaves the Strict-Transport-Security header the Gateway adds alone; "false" removes it.
  hsts: true
  # Terminate TLS at the Gateway (an https listener, plus a redirect from http). Needs a certificate: cert-manager below, or
  # your own in `tlsSecretName`. TLS in the pod is not supported.
  tls: true
  # An existing kubernetes.io/tls Secret for `host`, in the release namespace. Empty means <fullname>-tls, which cert-manager
  # fills in. Set it together with certmanager.enabled=false to bring your own certificate.
  tlsSecretName: ''
  # The listeners' names on the Gateway. Only matter for a Gateway this chart does not create.
  httpSectionName: http
  httpsSectionName: https
  # Path prefixes routed to the CA. An allow-list on purpose: the operator-only endpoints (/metrics, /internal/mail) stay inside
  # the cluster, and an operator route the service gains later is not exposed until it is added here.
  publicPaths:
    - /acme
    - /ca
    - /certs
    - /crl
    - /directory
    - /ocsp
    - /rate-limits
    - /status
    - /terms
# The certificate of `host` for the Gateway's https listener, issued by cert-manager (HTTP-01 through the Gateway). Nothing is
# issued for localhost, *.local or *.localhost.
certmanager:
  enabled: true
  # Contact address for the Let's Encrypt account of the Issuer this chart creates. Optional.
  email: ''
  # The Issuer (or ClusterIssuer, with kind: ClusterIssuer) the Certificate refers to. The default name is created by this
  # chart (a namespaced Issuer for Let's Encrypt production); any other name is used as it is and must already exist.
  name: '{{ include "rrst.fullname" . }}-issuer'
  kind: Issuer
  namespace: '{{ .Release.Namespace }}'
  # Use https://acme-staging-v02.api.letsencrypt.org/directory while testing (Let's Encrypt limits real certificates).
  server: https://acme-v02.api.letsencrypt.org/directory

datastores:
  mongo:
    database: acme

service:
  image:
    registry: ghcr.io
    repository: rapidmx/acme
    tag: 0.1.0
  imagePullSecret: ''
  # More than one replica needs Redis (nonces and rate limits would otherwise be per pod): the render fails without it.
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  # Anything else the service reads from its environment (`acme__...`, `datastores__...`): name -> value. See
  # docs/ARCHITECTURE.md ("Configuration"). Lists and maps are given as JSON. Overrides everything this chart sets.
  config: {}
  #   acme__order_expiry_hours: 72
  #   acme__ca__profiles__signing__validity_days: 30
  #   acme__rate_limits__overrides: '[{"key":"domain:example.org","limit":"certificatesPerDomain","burst":400}]'
  extraEnv: []
  # Waits for the bundled MongoDB and Redis to accept connections before starting (a plain TCP check with the app's own
  # image), so a first install does not crash-loop while they pull and start.
  waitForDatastores: true
  terminationGracePeriodSeconds: 60
  # preStop sleep + the server's drain (shutdown.drain_timeout, 10 s) must fit in the grace period.
  preStopSleepSeconds: 10
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    # Makes the mounted secret files (mode 0440) readable by the service's group.
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  startupProbe:
    httpGet:
      path: /status
      port: http
    periodSeconds: 5
    failureThreshold: 60
  readinessProbe:
    httpGet:
      path: /status
      port: http
    periodSeconds: 5
    failureThreshold: 2
  livenessProbe:
    httpGet:
      path: /status
      port: http
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  # With more than one replica, spread the pods over nodes (and, best effort, zones). Replaced by your own list when set.
  topologySpreadConstraints: []
  affinity: {}
  nodeSelector: {}
  tolerations: []
  podAnnotations: {}
  podLabels: {}
  # Rendered when replicas > 1.
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1

# Bundled MongoDB (Bitnami): the record of everything the CA issued and revoked. Certificates in it are the only copy of what
# was issued, so give it persistent storage, back it up (docs/DEPLOYMENT.md), or use a managed MongoDB: set create=false and
# `url`. Note that the Bitnami charts pull the `latest` image tag; pin mongodb.image.tag yourself to control major upgrades.
mongodb:
  create: true
  # A connection string for an external MongoDB (credentials included, so it is stored in a Secret); wins over the bundled one.
  url: ''
  architecture: standalone
  auth:
    enabled: true
    # The root password lives in this chart's <release>-datastore-auth Secret, generated once and kept across upgrades, so
    # the chart can build the connection string on the first install. Set `rootPassword` to choose it yourself.
    existingSecret: '{{ .Release.Name }}-datastore-auth'
    rootPassword: ''
  persistence:
    enabled: true
  # Only pods labelled <fullname>-client (the CA's, see the Deployment) may connect; Bitnami's default admits any pod. Needs
  # a CNI that enforces NetworkPolicy.
  networkPolicy:
    enabled: true
    allowExternal: false
  # Minimum requests only, never limits: a limit throttles the pod (CPU) or kills it (memory) even when the node has plenty to
  # spare. Bitnami's default "small" preset sets a limit as well as a request, so the preset is turned off.
  resourcesPreset: none
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
      ephemeral-storage: 50Mi
  # One mongod owns the data directory at a time (its lock file lives on the volume), so a rolling update deadlocks: the new
  # pod cannot start while the old one runs. Recreate stops the old pod first.
  updateStrategy:
    type: Recreate
# Bundled Redis (Bitnami): nonces and rate-limit buckets only - nothing here is worth persisting.
redis:
  create: true
  # A connection URL for an external Redis (redis://:password@host:6379); wins over the bundled one.
  url: ''
  architecture: standalone
  auth:
    enabled: true
    existingSecret: '{{ .Release.Name }}-datastore-auth'
    existingSecretPasswordKey: redis-password
    password: ''
  master:
    resourcesPreset: none
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
        ephemeral-storage: 50Mi
    persistence:
      enabled: false
  replica:
    persistence:
      enabled: false
  networkPolicy:
    enabled: true
    allowExternal: false
