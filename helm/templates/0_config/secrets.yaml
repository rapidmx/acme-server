{{- /*
The bearer secrets the service checks in constant time: acme.metrics_secret (GET /metrics), acme.mail.inbound.http_secret
(POST /internal/mail/inbound) and acme.admin_secret (the operator API under /admin, which can revoke every certificate). Each is generated once and kept: an explicit value wins,
otherwise the value already stored in this Secret (read back with `lookup`, so it survives upgrades and every replica shares
it), otherwise a new random one. With secrets.existingSecret that Secret is used instead and nothing is rendered here. Without
a secret the route answers 404, which is why disabling one here switches that route off.
*/ -}}
{{- if and (not .Values.secrets.existingSecret) (or .Values.metrics.enabled .Values.inboundHttp.enabled .Values.admin.enabled) }}
{{-   $name := printf "%s-secrets" (include "rrst.fullname" .) }}
{{-   $existing := (lookup "v1" "Secret" .Release.Namespace $name) | default dict }}
{{-   $stored := (get $existing "data") | default dict }}
{{-   $generated := list }}
{{-   if and .Values.metrics.enabled (not .Values.metrics.secret) }}
{{-     $generated = append $generated "metrics.secret" }}
{{-   end }}
{{-   if and .Values.inboundHttp.enabled (not .Values.inboundHttp.secret) }}
{{-     $generated = append $generated "inboundHttp.secret" }}
{{-   end }}
{{-   if and .Values.admin.enabled (not .Values.admin.secret) }}
{{-     $generated = append $generated "admin.secret" }}
{{-   end }}
{{-   $_ := include "rrst.assertStableSecrets" (dict "missing" $generated "context" .) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "rrst.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.metrics.enabled }}
  acme__metrics_secret: {{ include "rrst.persistedSecret" (dict "value" .Values.metrics.secret "stored" (get $stored "acme__metrics_secret") "context" .) | quote }}
  {{- end }}
  {{- if .Values.admin.enabled }}
  acme__admin_secret: {{ include "rrst.persistedSecret" (dict "value" .Values.admin.secret "stored" (get $stored "acme__admin_secret") "context" .) | quote }}
  {{- end }}
  {{- if .Values.inboundHttp.enabled }}
  acme__mail__inbound__http_secret: {{ include "rrst.persistedSecret" (dict "value" .Values.inboundHttp.secret "stored" (get $stored "acme__mail__inbound__http_secret") "context" .) | quote }}
  {{- end }}
{{- end }}
