# A complete LOCAL / DEVELOPMENT stack: the CA, MongoDB, Redis, a mail sink for the verification e-mails it sends, and a
# throw-away development CA. It is not a deployment: see docs/DEPLOYMENT.md for that (Helm chart in ./helm).
#
#   docker compose up --build
#
#   CA API / trust endpoints   http://localhost:3000            (directory: http://localhost:3000/directory)
#   Mail sink (web UI)         http://localhost:8025            every e-mail the CA sends lands here, nothing leaves the host
#   Reply e-mails (SMTP)       localhost:2525                   the CA's built-in receiver, see below
#
# Sending a reply e-mail to the built-in SMTP receiver. The receiver accepts mail only for the two addresses below
# (acme__mail__from and acme__mail__reply_to); anything else is refused at RCPT TO. With a reply saved as reply.eml:
#
#   curl --url smtp://localhost:2525 --mail-from you@example.org --mail-rcpt acme-response@acme.localdomain --upload-file reply.eml
#
# (swaks --server localhost:2525 --to acme-response@acme.localdomain --from you@example.org --data @reply.eml works too.)
# The receiver only takes the message in: the CA then verifies its DKIM signature against the sender's real DNS (the
# `d=` domain must equal the From domain, and the From must be the address being validated), so a reply only completes a
# challenge when it is genuinely DKIM-signed by a domain whose public key is published. There is no DNS in this stack:
# to run email-reply-00 end to end locally, use an address on a domain you control, or point the container at a resolver
# that serves the test domain's `<selector>._domainkey` TXT record (`dns:` on the `acme` service).
#
# Development only: NODE_ENV=development switches the production start-up guard off (http://localhost URL, placeholder
# mail addresses, no DKIM key), the issuing CA's key passphrase is public, and every port is bound to 127.0.0.1.
name: acme

services:
    acme:
        image: acme:local
        build:
            context: .
            target: runtime
        depends_on:
            ca-init:
                condition: service_completed_successfully
            mongo:
                condition: service_healthy
            redis:
                condition: service_healthy
            mailpit:
                condition: service_started
        ports:
            - "127.0.0.1:3000:3000"
            # The built-in SMTP receiver (container port 2525; a real deployment maps it to port 25, see helm/).
            - "127.0.0.1:2525:2525"
        environment:
            NODE_ENV: development
            # Base of every URL handed to clients (directory, certificates' CRL/OCSP/AIA addresses).
            acme__external_url: http://localhost:3000
            datastores__mongo__url: mongodb://mongo:27017/acme
            datastores__mongo__database: acme
            # Nonces and rate-limit buckets in Redis, as in a real deployment (without it they live in process memory).
            datastores__cache__type: redis
            datastores__cache__url: redis://redis:6379
            # Outbound: the challenge e-mails go to the mail sink, unencrypted and unauthenticated. No DKIM key here, so the
            # mails are sent unsigned - real clients (and real receivers) require DKIM, which is why this is a sink.
            acme__mail__smtp__host: mailpit
            acme__mail__smtp__port: 1025
            acme__mail__smtp__ignore_tls: "true"
            acme__mail__from: acme-challenge@acme.localdomain
            acme__mail__reply_to: acme-response@acme.localdomain
            # Inbound: the built-in SMTP receiver for the applicants' replies.
            acme__mail__inbound__smtp__enabled: "true"
            acme__mail__inbound__smtp__port: 2525
            # Set to enable GET /metrics (bearer token) and POST /internal/mail/inbound (bearer token, HTTP ingest for a
            # mail bridge); both answer 404 without them.
            acme__metrics_secret: dev-metrics-secret
            acme__mail__inbound__http_secret: dev-inbound-secret
            # The issuing CA generated by `ca-init` below. The key is encrypted; the passphrase comes from this variable.
            acme__ca__manifest: /var/lib/acme/ca/issuers.json
            ACME_CA_KEY_PASSPHRASE: dev-only-passphrase
        volumes:
            - ca:/var/lib/acme/ca:ro
        # The service writes nothing to disk and needs no privileges, so run it the way the Helm chart does: read-only root
        # file system with a scratch /tmp, no capabilities.
        read_only: true
        tmpfs:
            - /tmp
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        stop_grace_period: 30s

    # Generates a throw-away development CA (an issuing CA under a root whose private key is NOT kept) into the `ca` volume,
    # once: it does nothing when the volume already holds an issuers.json. To start over, `docker compose down -v` (every
    # certificate issued so far then stops chaining to the new CA).
    #
    # Run it with other options by hand to see them: `docker compose run --rm ca-init --help`. Never use this for a real CA;
    # the root belongs on an offline machine (docs/DEPLOYMENT.md).
    ca-init:
        image: acme-ca-init:local
        build:
            context: .
            target: ca-init
        environment:
            ACME_CA_KEY_PASSPHRASE: dev-only-passphrase
        volumes:
            - ca:/var/lib/acme/ca
        entrypoint: ["/bin/sh", "-c"]
        command:
            - |
                if [ -f /var/lib/acme/ca/issuers.json ]; then
                    echo "The development CA already exists in the ca volume; keeping it."
                else
                    exec node /app/node_modules/tsx/dist/cli.mjs /app/scripts/ca-init.ts \
                        --dir /var/lib/acme/ca \
                        --base-url http://localhost:3000 \
                        --passphrase-env ACME_CA_KEY_PASSPHRASE \
                        --no-root-key
                fi

    mongo:
        image: mongo:8
        volumes:
            - mongo_data:/data/db
        healthcheck:
            test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            interval: 5s
            timeout: 5s
            retries: 20

    redis:
        image: redis:8-alpine
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 20

    # Accepts every e-mail on SMTP 1025 and shows it in a web UI; nothing is relayed anywhere. Read the challenge e-mail
    # (`Subject: ACME: <token-part1>`) here.
    mailpit:
        image: axllent/mailpit:v1.29
        ports:
            - "127.0.0.1:8025:8025"

volumes:
    ca:
    mongo_data:
